[theme]
base = "light"
primaryColor = "#121216"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f2fb"
textColor = "#111114"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
# The repo ships a bundled web app (hundreds of files). Watching them all exhausts the
# inotify limit on Streamlit Cloud, and a deployed app does not need hot reload anyway.
fileWatcherType = "none"
